# =============================================================================
#  nginx 版配置（备选）
#
#  什么时候用它：你更熟 nginx，或者服务器上已经有 nginx 在跑别的站点。
#  默认推荐 Caddy —— 证书申请续期全自动，配置只有三行。
#  用 nginx 的话证书要自己配 certbot 定时续期。
#
#  步骤：
#    1) 安装：apt install -y nginx certbot python3-certbot-nginx
#    2) 域名换成你的，复制到 /etc/nginx/conf.d/kaoyan.conf
#    3) nginx -t && systemctl reload nginx
#    4) 申请证书：certbot --nginx -d 你的域名
#       （certbot 会自动改这里的配置，把 443 和证书路径填好）
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name kaoyan.example.com;

    # certbot 会把这行改成跳转 https
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kaoyan.example.com;

    # 下面两行由 certbot 自动填
    # ssl_certificate     /etc/letsencrypt/live/kaoyan.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kaoyan.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 单用户应用，上传体量很小，收紧一点
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8848;
        proxy_http_version 1.1;

        # 这三行是关键：应用靠 X-Forwarded-Proto 判断自己在 HTTPS 后面，
        # 少了它，登录凭据就不会带 Secure 标记。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长难句分析、作文批改这类 AI 调用可能跑几分钟，别中途掐断
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  30s;
    }
}
